<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leandro Fagundes Eletrica</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0a0a0a;color:#fff;padding:14px}.h{text-align:center;background:#000;padding:14px;border-radius:16px;border:2px solid #ffcc00}.h b{font-size:26px}.card{background:#1a1a1a;padding:14px;border-radius:14px;margin-top:12px}label{display:block;margin:12px 0 6px;font-weight:bold;color:#ffcc00}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:16px}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:bold;margin-top:10px}.wpp{background:#25D366;color:#fff}.save{background:#7c4dff;color:#fff}.link{background:#00a8e8;color:#fff}.agenda{background:#ffcc00;color:#000}.tot{font-size:24px;text-align:center;color:#ffcc00;margin:10px 0}.ck{display:flex;gap:8px;align-items:center;background:#222;padding:10px;border-radius:10px;margin-top:8px}.ck input{width:20px}.tabs{display:flex;gap:8px;margin-top:12px}.tab{flex:1;padding:12px;border:none;border-radius:12px;font-weight:bold;background:#222;color:#fff}.tab.a{background:#ffcc00;color:#000}.hid{display:none}.it{background:#222;padding:12px;border-radius:12px;margin-top:10px;border-left:4px solid #00a8e8}.mn{flex:1;padding:9px;border:none;border-radius:8px;font-weight:bold}#box{display:none;background:#222;padding:10px;border-radius:10px;margin-top:10px;word-break:break-all;font-size:12px}#cli{background:#fff;color:#111;border-radius:16px;padding:18px;margin-top:12px}#cli h2{margin:0;color:#000}#cli .ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}#cli .tt{font-size:24px;font-weight:900;text-align:center;margin:14px 0 4px}#dt{font-weight:900;color:#e60000;font-size:18px;background:#ffe6e6;padding:10px;border-radius:10px;border:2px solid #e60000;text-align:center}#tp{font-weight:900;color:#e60000;font-size:18px;background:#ffe6e6;padding:10px;border-radius:10px;border:2px solid #e60000;text-align:center;margin-top:8px}.det{background:#111;padding:10px;border-radius:10px;margin-top:8px;font-size:14px;display:none}.det b{color:#ffcc00}.bs{display:block;width:100%;text-align:left;background:#222;color:#fff;border:1px solid #444;padding:12px;border-radius:10px;margin-top:6px;font-size:15px}.bs b{color:#ffcc00}.sel{background:#222;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:4px solid #00a8e8}.sel b{flex:1;font-size:14px}.sel input{width:55px;padding:8px;text-align:center}</style></head><body>
<div class="h"><b>LEANDRO FAGUNDES ELETRICA</b><p style="color:#ffcc00;margin:6px 0 0">WhatsApp: (24) 98123-1238</p></div>
<div id="cli" class="hid"><h2 id="ct"></h2><p id="cc" style="color:#555"></p><p id="dt"></p><p id="tp"></p><div id="ci"></div><div id="cr"></div><div class="tt" id="ctt"></div><p style="text-align:center;color:#555;font-size:13px">Garantia da mao de obra de 30 dias</p><p id="co" style="background:#f5f5f5;padding:10px;border-radius:10px"></p><button class="btn wpp" onclick="ace()">Aceitar Orcamento</button><button class="btn" style="background:#ff4444;color:#fff" onclick="rec()">Recusar Orcamento</button><button class="btn" style="background:#000;color:#fff" onclick="location.href='tel:+5524981231238'">Ligar para Leandro</button></div>
<div id="adm"><div class="tabs"><button class="tab a" id="t1" onclick="aba(1)">Novo Orcamento</button><button class="tab" id="t2" onclick="aba(2)">Salvos / Agenda</button></div>
<div id="a1"><div class="card"><label>Nome do cliente</label><input id="cliente"><button class="btn agenda" onclick="buscarContato()">📞 Buscar na agenda do celular</button><label>Telefone</label><input id="tel" placeholder="(24) 9xxxx-xxxx"><label>Endereco / Bairro</label><input id="endereco"><label>Servicos escolhidos - clique abaixo para adicionar</label><div id="lista"></div><p id="sem" style="text-align:center;color:#aaa">Nenhum servico ainda. Clique em um abaixo.</p><label>Todos os servicos - e so clicar</label><div id="ls"></div><label>Adicionais</label><div class="ck"><input type="checkbox" id="fint" onchange="calc()"><span>Fiacao interna - 15% a mais</span></div><div class="ck"><input type="checkbox" id="fext" onchange="calc()"><span>Fiacao externa c/ canaletas - 25% a mais</span></div><label>Desconto (R$)</label><input id="desc" type="number" value="0" oninput="calc()"><label>Observacoes</label><textarea id="obs" rows="2"></textarea><div class="tot" id="total">Total: R$ 0,00</div></div>
<div class="card"><h3 style="margin:0;color:#ffcc00">Agendar</h3><label>Data</label><input type="date" id="data"><label>Hora</label><input type="time" id="hora" value="09:00"><label>Tipo</label><select id="tipo"><option>Visita para orcamento</option><option>Servico agendado</option><option>Retorno / Garantia</option><option>Em andamento</option></select><label>Status</label><select id="status"><option>Pendente</option><option>Agendado</option><option>Em andamento</option><option>Concluido</option></select><button class="btn save" onclick="salvar()">Salvar + Agendar</button><button class="btn wpp" onclick="wpp()">Enviar texto pelo WhatsApp</button><button class="btn link" onclick="link()">Gerar Link do Orcamento</button><div id="box"></div></div></div>
<div id="a2" class="hid"><div class="card"><label>Buscar</label><input id="busca" oninput="render()" placeholder="Digite nome, bairro..."><div id="hist"></div></div></div></div>
<script>
var S=[["Troca interruptor/tomada ate 5 pts",40],["Troca interruptor/tomada acima 5 pts",35],["Troca Three Way",60],["Troca de chuveiro",60],["Resistencia de chuveiro",50],["Troca de disjuntor",60],["Ventilador teto novo e passar fio",70],["Ventilador teto novo s/ passar fio",60],["Ventilador teto com controle",60],["Ventilador teto tirar e colocar plafon",50],["Troca de capacitor",35],["Ventilador parede novo c/ fio",70],["Ventilador parede s/ fio",50],["Instalar lustre s/ montar",150],["Instalar e montar lustre",250],["Fechadura eletronica",150],["Instalacao motor portao eletronico",300],["Troca motor portao eletronico",150],["Troca placa portao eletronico",70],["Configuracao controle portao",30],["Regulagem portao sensor",50],["Instalacao sensor presenca",70],["Instalacao boia nivel c/ fiacao",150],["Ponto energia ar c/ disjuntor",150],["Ponto energia ar s/ disjuntor",120],["Padrao mono",300],["Padrao mono rural",350],["Padrao bi",350],["Padrao tri",400],["Troca padrao poste p/ outro",400],["Bomba sapo",100],["Bomba caneta",120],["Troca boia nivel",50],["Troca motor mono",70],["Troca motor bifasico",100],["Troca motor trifasico",150],["Instalacao chave partida estrela triangulo",200],["Troca contatora",250],["Instalacao de Spot",60],["Fita de led ate 25 metros",100],["Quadro distribuicao ate 12 disjuntores",420],["Quadro distribuicao 12 a 24 disjuntores",600],["Quadro distribuicao 24 ate 48 disjuntores",800],["Passagem Cabo ate 6mm por metro",1.5],["Passagem Cabo 10mm por metro",2],["Instalacao refletor com fiacao",100],["Troca de refletor",70]];
var cur=null,sel=[];
async function buscarContato(){try{if(!('contacts' in navigator)){alert('Seu navegador nao suporta buscar na agenda. Digite o numero manualmente.');return;}var props=['name','tel'];var opts={multiple:false};var c=await navigator.contacts.select(props,opts);if(c&&c.length>0){if(c[0].name&&c[0].name[0])document.getElementById('cliente').value=c[0].name[0];if(c[0].tel&&c[0].tel[0])document.getElementById('tel').value=c[0].tel[0];alert('Contato preenchido!');}}catch(e){alert('Permita o acesso aos contatos para usar.');}}
function aba(n){document.getElementById('a1').classList.toggle('hid',n!=1);document.getElementById('a2').classList.toggle('hid',n!=2);document.getElementById('t1').classList.toggle('a',n==1);document.getElementById('t2').classList.toggle('a',n==2);if(n==2)render();}
function listaServ(){var h='';for(var i=0;i<S.length;i++){h+='<button class="bs" onclick="addS('+i+')">+ '+S[i][0]+' - <b>R$ '+S[i][1]+'</b></button>';}document.getElementById('ls').innerHTML=h;}
function addS(i){sel.push({nome:S[i][0],preco:S[i][1],qtd:1});renderSel();calc();}
function renderSel(){var el=document.getElementById('lista');document.getElementById('sem').style.display=sel.length?'none':'block';var h='';for(var i=0;i<sel.length;i++){h+='<div class="sel"><b>'+sel[i].nome+'<br><span style="color:#ffcc00">R$ '+(sel[i].preco*sel[i].qtd).toFixed(2).replace('.',',')+'</span></b><span>Qtd:</span><input type="number" value="'+sel[i].qtd+'" min="1" onchange="sel['+i+'].qtd=parseInt(this.value)||1;renderSel();calc()"><button onclick="sel.splice('+i+',1);renderSel();calc()" style="background:#ff4444;color:#fff;border:none;padding:10px;border-radius:8px">X</button></div>';}el.innerHTML=h;}
function calc(){var t=0;for(var i=0;i<sel.length;i++)t+=sel[i].preco*sel[i].qtd;var x=0;if(document.getElementById('fint').checked)x+=t*0.15;if(document.getElementById('fext').checked)x+=t*0.25;var ds=parseFloat(document.getElementById('desc').value)||0;var f=Math.max(0,t+x-ds);document.getElementById('total').innerText='Total: R$ '+f.toFixed(2).replace('.',',');return{total:t,extra:x,desc:ds,final:f};}
function get(){var d=calc();var o={};o.id=Date.now();o.cliente=document.getElementById('cliente').value||'';o.tel=document.getElementById('tel').value||'';o.endereco=document.getElementById('endereco').value||'';o.obs=document.getElementById('obs').value||'';o.data=document.getElementById('data').value||'';o.hora=document.getElementById('hora').value||'';o.tipo=document.getElementById('tipo').value||'';o.status=document.getElementById('status').value||'';o.detalhes=sel.map(function(s){return{nome:s.nome,qtd:s.qtd,preco:s.preco}});o.total=d.total;o.extra=d.extra;o.desc=d.desc;o.final=d.final;o.fint=document.getElementById('fint').checked;o.fext=document.getElementById('fext').checked;return o;}
function salvar(){var d=get();if(!d.detalhes.length){alert('Adiciona 1 servico antes de salvar');return;}var a=[];try{a=JSON.parse(localStorage.getItem('fagundes')||'[]')}catch(e){}a.unshift(d);localStorage.setItem('fagundes',JSON.stringify(a));alert('Salvo! '+(d.cliente||'Orcamento')+' - R$ '+d.final.toFixed(2));aba(2);}
function getS(){try{return JSON.parse(localStorage.getItem('fagundes')||'[]')}catch(e){return[]}}
function tog(id){var el=document.getElementById('det-'+id);if(!el)return;el.style.display=el.style.display=='block'?'none':'block';}
function render(){var a=getS();var b=(document.getElementById('busca').value||'').toLowerCase();var h='';for(var i=0;i<a.length;i++){var x=a[i];if((x.cliente+' '+x.endereco+' '+x.tel).toLowerCase().indexOf(b)==-1)continue;var ls='';for(var j=0;j<(x.detalhes||[]).length;j++){ls+='- '+x.detalhes[j].nome+' x'+x.detalhes[j].qtd+' - R$ '+(x.detalhes[j].preco*x.detalhes[j].qtd).toFixed(2).replace('.',',')+'<br>';}if(!ls)ls='Sem detalhes salvos';h+='<div class="it" onclick="tog('+x.id+')"><b>'+(x.cliente||'Sem nome')+'</b> - '+x.status+'<br>'+(x.endereco||'')+' - '+x.tel+'<br>'+x.data+' as '+x.hora+' - '+x.tipo+'<br><b style="color:#ffcc00">R$ '+x.final.toFixed(2).replace('.',',')+'</b> - Clique para ver detalhes<div class="det" id="det-'+x.id+'"><b>Servicos:</b><br>'+ls+'<br><b>Subtotal:</b> R$ '+(x.total||0).toFixed(2).replace('.',',')+'<br>'+(x.fint?'<b>Fiacao interna 15%</b><br>':'')+(x.fext?'<b>Fiacao externa 25%</b><br>':'')+(x.desc?'<b>Desconto:</b> R$ '+x.desc.toFixed(2).replace('.',',')+'<br>':'')+(x.obs?'<b>Obs:</b> '+x.obs+'<br>':'')+'</div><div style="display:flex;gap:6px;margin-top:8px" onclick="event.stopPropagation()"><button class="mn" style="background:#00a8e8;color:#fff" onclick="tog('+x.id+')">Ver detalhes</button><button class="mn" style="background:#ffcc00" onclick="carregar('+x.id+')">Editar</button><button class="mn" style="background:#ff4444;color:#fff" onclick="exc('+x.id+')">Excluir</button></div></div>';}document.getElementById('hist').innerHTML=h||'<p style="text-align:center;color:#aaa">Nenhum registro.</p>';}
function carregar(id){var a=getS();var x=null;for(var i=0;i<a.length;i++)if(a[i].id==id)x=a[i];if(!x)return;document.getElementById('cliente').value=x.cliente||'';document.getElementById('tel').value=x.tel||'';document.getElementById('endereco').value=x.endereco||'';document.getElementById('obs').value=x.obs||'';document.getElementById('data').value=x.data||'';document.getElementById('hora').value=x.hora||'09:00';document.getElementById('tipo').value=x.tipo||'Servico agendado';document.getElementById('status').value=x.status||'Pendente';document.getElementById('desc').value=x.desc||0;document.getElementById('fint').checked=!!x.fint;document.getElementById('fext').checked=!!x.fext;sel=[];for(var j=0;j<(x.detalhes||[]).length;j++)sel.push({nome:x.detalhes[j].nome,preco:parseFloat(x.detalhes[j].preco),qtd:parseInt(x.detalhes[j].qtd)||1});renderSel();calc();aba(1);alert('Carregado para editar!');}
function exc(id){if(!confirm('Excluir esse?'))return;localStorage.setItem('fagundes',JSON.stringify(getS().filter(function(x){return x.id!=id})));render();}
function wpp(){var d=get();var l='';for(var i=0;i<d.detalhes.length;i++)l+='- '+d.detalhes[i].nome+' (x'+d.detalhes[i].qtd+') - R$ '+(d.detalhes[i].preco*d.detalhes[i].qtd).toFixed(2).replace('.',',')+'\n';var m='*LEANDRO FAGUNDES ELETRICA*\n\n*ORCAMENTO*\n\n';if(d.cliente)m+='*Cliente:* '+d.cliente+'\n';if(d.endereco)m+='*Endereco:* '+d.endereco+'\n';if(d.data)m+='*Data:* '+d.data+' as '+d.hora+'\n';m+='\n*Servicos:*\n'+l+'\nSubtotal: R$ '+d.total.toFixed(2).replace('.',',')+'\n';if(d.fint)m+='Fiacao interna 15%: + R$ '+(d.total*0.15).toFixed(2).replace('.',',')+'\n';if(d.fext)m+='Fiacao externa 25%: + R$ '+(d.total*0.25).toFixed(2).replace('.',',')+'\n';if(d.desc>0)m+='Desconto: - R$ '+d.desc.toFixed(2).replace('.',',')+'\n';m+='\n*TOTAL: R$ '+d.final.toFixed(2).replace('.',',')+'*\n\n';if(d.obs)m+='*Obs:* '+d.obs+'\n\n';m+='Leandro Fagundes Eletrica - (24) 98123-1238\n*Garantia 30 dias*';var n=(d.tel||'').replace(/\D/g,'');if(n.length==11||n.length==10)n='55'+n;else n='5524981231238';window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank');}
function link(){var d=get();if(!d.detalhes.length||!d.final){alert('Adiciona 1 servico antes');return;}var c=btoa(unescape(encodeURIComponent(JSON.stringify(d))));var lk=location.href.split('#')[0]+'#orc='+c;var b=document.getElementById('box');b.style.display='block';b.innerHTML='Link gerado:<br><br>'+lk;try{navigator.clipboard.writeText(lk)}catch(e){}var m='Ola '+(d.cliente||'')+'! Segue seu orcamento *Leandro Fagundes Eletrica*:\n\n'+lk+'\n\n*Total: R$ '+d.final.toFixed(2).replace('.',',')+'*\n*Garantia 30 dias*';var n=(d.tel||'').replace(/\D/g,'');if(n.length==11||n.length==10)n='55'+n;else n='5524981231238';setTimeout(function(){window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')},500);}
function show(d){cur=d;document.getElementById('adm').classList.add('hid');var t=document.getElementById('cli');t.classList.remove('hid');document.getElementById('ct').innerText='Orcamento para '+(d.cliente||'Voce');document.getElementById('cc').innerText=(d.cliente?'Cliente: '+d.cliente+' ':'')+(d.endereco?'| '+d.endereco:'');var dt='';if(d.data){var p=d.data.split('-');dt=p.length==3?p[2]+'/'+p[1]+'/'+p[0]:d.data;}document.getElementById('dt').innerText='DATA: '+dt+' AS '+(d.hora||'');document.getElementById('tp').innerText=(d.tipo||'Servico agendado').toUpperCase();var h='';for(var i=0;i<d.detalhes.length;i++){h+='<div class="ln"><span>'+d.detalhes[i].nome+' <span style="color:#888">x'+d.detalhes[i].qtd+'</span></span><b>R$ '+(d.detalhes[i].preco*d.detalhes[i].qtd).toFixed(2).replace('.',',')+'</b></div>';}document.getElementById('ci').innerHTML=h;var r='<div class="ln"><span>Subtotal</span><b>R$ '+(d.total||0).toFixed(2).replace('.',',')+'</b></div>';if(d.fint)r+='<div class="ln"><span>Fiacao interna 15%</span><b>+ R$ '+(d.total*0.15).toFixed(2).replace('.',',')+'</b></div>';if(d.fext)r+='<div class="ln"><span>Fiacao externa 25%</span><b>+ R$ '+(d.total*0.25).toFixed(2).replace('.',',')+'</b></div>';if(d.desc>0)r+='<div class="ln"><span>Desconto</span><b>- R$ '+d.desc.toFixed(2).replace('.',',')+'</b></div>';document.getElementById('cr').innerHTML=r;document.getElementById('ctt').innerText='TOTAL: R$ '+d.final.toFixed(2).replace('.',',');var o=document.getElementById('co');if(d.obs){o.style.display='block';o.innerText='Obs: '+d.obs}else o.style.display='none';}
function ace(){if(!cur)return;window.open('https://wa.me/5524981231238?text='+encodeURIComponent('Ola Leandro! Sou '+(cur.cliente||'')+' e *ACEITO* o orcamento de *R$ '+cur.final.toFixed(2).replace('.',',')+'*'),' _blank');}
function rec(){if(!cur)return;window.open('https://wa.me/5524981231238?text='+encodeURIComponent('Ola Leandro! Sou '+(cur.cliente||'')+' e *NAO vou aceitar* o orcamento de *R$ '+cur.final.toFixed(2).replace('.',',')+'*'),' _blank');}
listaServ();renderSel();
document.getElementById('data').value=new Date().toISOString().slice(0,10);
if(location.hash.indexOf('#orc=')==0){try{show(JSON.parse(decodeURIComponent(escape(atob(location.hash.replace('#orc=',''))))))}catch(e){}}
</script></body></html>
